name: Update jobs
on:
  schedule:
    - cron: "15 5,9,13,17,21 * * *"   # five times a day, UK daytime
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_jobs.py
      - name: Save new jobs
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
